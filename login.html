<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Educativa para Pessoas com Deficiências Intelectuais</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/plataforma.css">
</head>
<body class="stars">
    <main class="container">  

        <form id="login-form">
            <h1>Login</h1>

            <div class="input-box">   
                <input id="email-input" placeholder="Usuário" type="email" required>
            </div>

            <div class="input-box">   
                <input id="senha-input" placeholder="Senha" type="password" required>
            </div>

            <div class="remember-forgot">
             <label> 
                Lembrar Senha
                <input type="checkbox"> 
             </label>
                 <a href="#">Esqueci a senha</a>
            </div>

          <button type="submit" class="login">Login</button>
            <div class="register-link">
                <p> Não possui cadastro? <a href="/cadastro.html"> Criar uma conta</a></p>
            </div>
        </form>

    </main>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
