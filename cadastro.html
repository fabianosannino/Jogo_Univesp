<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/plataforma.css">

    <title>Cadastro - Plataforma Educativa</title>
</head>
<body class="stars">
    <main class="container">  

        <form id="cadastro-form">
            <h1>Cadastro</h1>
            <div class="input-box">   
                <input id="nome-input" placeholder="Nome" type="text" required>
            </div>

            <div class="input-box">   
                <input id="email-input" placeholder="Email" type="email" required>
            </div>

            <div class="input-box">   
                <input id="senha-input" placeholder="Senha" type="password" required>
            </div>

            <div class="input-box">   
                <input id="senha-confirma-input" placeholder="Confirmar Senha" type="password" required>
            </div>

          <button type="submit" class="login">Login</button>
            <div class="register-link">
                <!-- Sem a barra inicial: ver a nota em login.html. -->
                <p> Já possui cadastro? <a href="login.html"> Realizar Login</a></p>
            </div>
        </form>

    </main>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
